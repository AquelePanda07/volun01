<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voluntários Cadastrados — Sistema de Gestão de Voluntários</title>
  <link rel="stylesheet" href="css/style.css">
  <script>try { if (localStorage.getItem('sgv_tema') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script>
</head>
<body data-titulo="Voluntários Cadastrados">
  <main class="page-content">
    <div class="page-header">
      <div>
        <h1>Voluntários Cadastrados</h1>
        <p class="page-header__subtitulo">Consulte, edite ou remova os registros de voluntariado</p>
      </div>
      <div class="page-header__acoes">
        <button type="button" class="btn btn--outline" id="btn-termos-lote" disabled>
          <span data-icon="file"></span>
          <span id="btn-termos-lote-texto">Gerar Termos em Lote</span>
        </button>
        <a class="btn" href="cadastro.html">
          <span data-icon="plus"></span>
          Adicionar Voluntário
        </a>
      </div>
    </div>

    <section class="filtros-barra">
      <div class="busca-campo">
        <span data-icon="search"></span>
        <input type="search" id="filtro-busca" placeholder="Pesquisar por nome, CPF, contato, local ou cargo...">
      </div>
      <div class="filtro-grupo">
        <label for="filtro-secretaria">Secretaria</label>
        <select id="filtro-secretaria">
          <option value="">Todas</option>
        </select>
      </div>
      <div class="filtro-grupo">
        <label for="filtro-carga">Carga horária</label>
        <select id="filtro-carga">
          <option value="">Todas</option>
          <option value="40">40 horas</option>
          <option value="30">30 horas</option>
          <option value="20">20 horas</option>
        </select>
      </div>
      <div class="filtro-grupo">
        <label for="filtro-termo">Termo de adesão</label>
        <select id="filtro-termo">
          <option value="">Todos</option>
          <option value="termo-assinado">Termo assinado</option>
          <option value="termo-pendente">Termo pendente</option>
          <option value="renovacao-assinada">Renovação assinada</option>
          <option value="renovacao-pendente">Renovação pendente</option>
        </select>
      </div>
      <div class="filtro-grupo">
        <label for="filtro-ordem">Ordenar por</label>
        <select id="filtro-ordem">
          <option value="nome">Nome (A–Z)</option>
          <option value="nome-desc">Nome (Z–A)</option>
          <option value="cargo">Cargo (A–Z)</option>
          <option value="local">Local de prestação (A–Z)</option>
          <option value="dias">Dias para o término (menos dias primeiro)</option>
          <option value="dias-desc">Dias para o término (mais dias primeiro)</option>
        </select>
      </div>
    </section>

    <div class="lista-topo">
      <div class="chips" id="filtro-status" role="group" aria-label="Filtrar por status do contrato"></div>
      <span class="contador-resultados" id="contador-resultados"></span>
    </div>

    <div class="tabela-wrapper tabela-wrapper--responsiva">
      <table class="tabela-voluntarios">
        <thead>
          <tr>
            <th class="col-selecao"><input type="checkbox" id="selecionar-todos" title="Selecionar todos os voluntários listados" aria-label="Selecionar todos"></th>
            <th>Voluntário</th>
            <th>Local de Prestação</th>
            <th>Término do Contrato</th>
            <th>Dias para o Término</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-corpo"></tbody>
      </table>
    </div>

    <div class="lista-cards" id="lista-cards"></div>

    <div class="estado-vazio" id="estado-vazio" hidden>
      <span data-icon="users"></span>
      <p id="estado-vazio-texto">Nenhum voluntário cadastrado ainda.</p>
      <a class="btn" href="cadastro.html">Adicionar voluntário</a>
    </div>
  </main>

  <!-- Prévia do voluntário (lado direito). Preenchida por js/voluntarios.js -->
  <aside class="previa" id="previa" aria-label="Prévia do voluntário" hidden></aside>

  <script src="js/app.js"></script>
  <script src="js/voluntarios.js"></script>
</body>
</html>
