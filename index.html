<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestão de Voluntários</title>
  <link rel="stylesheet" href="css/style.css">
  <script>try { if (localStorage.getItem('sgv_tema') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script>
</head>
<body data-titulo="Painel de Controle">
  <main class="page-content">
    <section class="hero">
      <div>
        <span class="hero__data"><span data-icon="calendar"></span><span id="hero-data"></span></span>
        <h1 id="hero-saudacao">Olá!</h1>
        <p>Acompanhe o cadastro de pessoas voluntárias e os prazos dos contratos.</p>
      </div>
      <div class="hero__acoes">
        <a class="btn btn--outline" href="api/planilha.php" target="_blank" rel="noopener" title="Exporta todos os voluntários em uma planilha">
          <span data-icon="grid"></span>

        <a class="btn" href="cadastro.html">
          <span data-icon="plus"></span>
          Adicionar Voluntário

    <div class="painel-grid">
      <section class="painel">

  <script src="js/app.js"></script>
  <script src="js/painel.js"></script>
