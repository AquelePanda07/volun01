<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentos — Sistema de Gestão de Voluntários</title>
  <link rel="stylesheet" href="css/style.css">
  <script>try { if (localStorage.getItem('sgv_tema') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script>
</head>
<body data-titulo="Documentos dos Voluntários">
  <main class="page-content">
    <div class="page-header">
      <div>
        <h1>Documentos dos Voluntários</h1>
        <p class="page-header__subtitulo">Anexe um único arquivo por voluntário com RG, CPF, comprovante de luz, histórico escolar e certidão negativa, e marque o que ele contém</p>
      </div>
    </div>

    <div class="termos-resumo" id="docs-resumo"></div>

    <section class="filtros-barra">
      <div class="busca-campo">
        <span data-icon="search"></span>
        <input type="search" id="filtro-busca" placeholder="Pesquisar por nome, CPF, local ou cargo...">
      </div>
      <div class="filtro-grupo">
        <label for="filtro-falta">Falta o documento</label>
        <select id="filtro-falta">
          <option value="">Qualquer</option>
        </select>
      </div>
      <div class="filtro-grupo">
        <label for="filtro-status">Status do contrato</label>
        <select id="filtro-status">
          <option value="">Todos</option>
          <option value="ATIVO">Ativo</option>
          <option value="A_INICIAR">A Iniciar</option>
          <option value="ENCERRADO">Encerrado</option>
        </select>
      </div>
    </section>

    <div class="lista-topo">
      <div class="chips" id="filtro-situacao" role="group" aria-label="Filtrar pela situação dos documentos"></div>
      <span class="contador-resultados" id="contador-resultados"></span>
    </div>

    <div class="docs-pagina-lista" id="docs-lista">
      <!-- Preenchido por js/documentos.js -->
    </div>

    <div class="estado-vazio" id="estado-vazio" hidden>
      <span data-icon="paperclip"></span>
      <p id="estado-vazio-texto">Nenhum voluntário cadastrado ainda.</p>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/documentos.js"></script>
</body>
</html>
